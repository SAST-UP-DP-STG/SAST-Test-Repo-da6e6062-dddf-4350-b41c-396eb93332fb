server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:h2:file:./data/dispatch-db
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  jwt:
    issuer: FieldServiceDispatch
    ttlSeconds: 3600
    secret: field-service-dispatch-secret-key
  command-server:
    port: 9090
    address: 0.0.0.0
