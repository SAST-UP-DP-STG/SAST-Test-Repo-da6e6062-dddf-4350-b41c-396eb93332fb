<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in — UserApp</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 2rem; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 360px; width: 100%; }
        h1 { margin: 0 0 1.5rem; font-size: 1.25rem; color: #333; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; color: #555; }
        input[type="email"], input[type="password"] { width: 100%; padding: 0.6rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .msg { padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; font-size: 0.9rem; }
        .msg.success { background: #dcfce7; color: #166534; }
        .msg.error { background: #fee2e2; color: #991b1b; }
        a { color: #2563eb; text-decoration: none; display: block; margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p th:if="${message}" class="msg success" th:text="${message}"></p>
        <p th:if="${error}" class="msg error" th:text="${error}"></p>
        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" required autocomplete="username"/>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"/>
            <button type="submit">Sign in</button>
        </form>
        <a th:href="@{/register}">Create an account</a>
    </div>
</body>
</html>
