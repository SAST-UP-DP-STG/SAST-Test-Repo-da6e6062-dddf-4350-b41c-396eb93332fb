<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard — UserApp</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1.5rem; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
        h1 { margin: 0; font-size: 1.5rem; color: #333; }
        .user-info { font-size: 0.9rem; color: #555; }
        .user-info strong { color: #333; }
        a.btn { display: inline-block; padding: 0.4rem 0.8rem; background: #64748b; color: #fff; text-decoration: none; border-radius: 4px; font-size: 0.9rem; }
        a.btn:hover { background: #475569; }
        .msg { padding: 0.6rem; margin-bottom: 1rem; border-radius: 4px; font-size: 0.9rem; }
        .msg.success { background: #dcfce7; color: #166534; }
        .msg.error { background: #fee2e2; color: #991b1b; }
        .msg.info { background: #dbeafe; color: #1e40af; word-break: break-all; }
        .card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f8fafc; font-weight: 600; color: #334155; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        form { display: inline; }
        button, .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
        button.primary, .btn-sm.primary { background: #2563eb; color: #fff; }
        button.danger { background: #dc2626; color: #fff; }
        button.secondary { background: #64748b; color: #fff; }
        .btn-sm { font-family: inherit; }
        input[type="text"], input[type="email"], input[type="password"], select { padding: 0.35rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        .form-row { margin-bottom: 0.5rem; }
        .form-row label { display: inline-block; min-width: 80px; font-size: 0.9rem; }
        h2 { margin: 0 0 0.75rem; font-size: 1.1rem; color: #333; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
        <div class="user-info">
            Logged in as <strong th:text="${currentUser}">email</strong> (role: <strong th:text="${currentRole}">USER</strong>)
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-sm primary">Log out</button>
            </form>
        </div>
    </div>

    <p th:if="${message}" class="msg success" th:text="${message}"></p>
    <p th:if="${error}" class="msg error" th:text="${error}"></p>
    <p th:if="${resetToken}" class="msg info">
        Use this token on the reset page: <a th:href="@{/reset-password-confirm(token=${resetToken})}">Open reset page with token</a>
    </p>

    <div class="card">
        <h2>Create user</h2>
        <form th:action="@{/admin/users}" method="post">
            <div class="form-row">
                <label for="new-email">Email</label>
                <input id="new-email" name="email" type="email" required/>
            </div>
            <div class="form-row">
                <label for="new-password">Password</label>
                <input id="new-password" name="password" type="password" required/>
            </div>
            <div class="form-row">
                <label for="new-role">Role</label>
                <select id="new-role" name="role">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="form-row">
                <label for="new-enabled">Enabled</label>
                <input id="new-enabled" name="enabled" type="checkbox" value="true" checked/>
            </div>
            <button type="submit" class="primary">Create user</button>
        </form>
    </div>

    <div class="card">
        <h2>All users</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Enabled</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.email}">user@example.com</td>
                    <td th:text="${u.role}">USER</td>
                    <td th:text="${u.enabled}">true</td>
                    <td>
                        <div class="actions">
                            <form th:action="@{/admin/users/{id}/edit(id=${u.id})}" method="post" style="display:inline;">
                                <input type="text" name="email" th:value="${u.email}" size="18"/>
                                <select name="role">
                                    <option value="USER" th:selected="${u.role.name() == 'USER'}">USER</option>
                                    <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">ADMIN</option>
                                </select>
                                <label><input type="checkbox" name="enabled" value="true" th:checked="${u.enabled}"/> on</label>
                                <button type="submit" class="secondary">Edit</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/password-reset/request(id=${u.id})}" method="post" style="display:inline;">
                                <button type="submit" class="secondary">Request reset token</button>
                            </form>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline;" th:if="${u.email != currentUser}">
                                <button type="submit" class="danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Update my profile</h2>
        <form th:action="@{/me/profile}" method="post">
            <div class="form-row">
                <label for="profile-email">Email</label>
                <input id="profile-email" name="email" type="email" th:value="${currentUser}"/>
            </div>
            <div class="form-row">
                <label for="profile-password">New password (leave blank to keep)</label>
                <input id="profile-password" name="newPassword" type="password" placeholder="Optional"/>
            </div>
            <button type="submit" class="primary">Update profile</button>
        </form>
    </div>
</body>
</html>
